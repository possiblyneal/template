# Only the ecosystems whose manifests this template ships are listed. An entry
# naming a manifest that is not there fails the run with dependency_file_not_found
# rather than being skipped, so npm, pip, cargo, gomod, gradle, and swift cannot
# be listed ahead of the manifest that would justify one.
#
# Every /repo-builder flow that writes this file derives the language entries
# from the manifests the repository tracks and appends them below, re-deriving
# the whole set each run -- so an entry survives by being rebuilt rather than by
# being carried, and this file being replaced whole by an update cannot drop it.
# `directory` is the manifest's own directory, /apps/<name> where the module
# lives under apps/, so the entry cannot be derived from the ecosystem name
# alone.
#
# The ecosystem per manifest: npm for package.json, pip for pyproject.toml,
# gomod for go.mod, cargo for Cargo.toml, gradle for build.gradle.kts, swift for
# Package.swift. go.work and settings.gradle.kts are workspace files and earn no
# entry of their own; they say where the modules are, and the modules are what
# Dependabot reads.
#
# A cargo workspace is the one case where several manifests take a single entry.
# The root Cargo.toml holding [workspace] earns it and a member listed in its
# members earns none: cargo's fetcher reads that list and bumps every member
# from the root's job, moving the root Cargo.lock with it. A member entry opens
# a duplicate pull request, and where the member pins its own versions rather
# than inheriting with { workspace = true } that job sees no lockfile at all.
#
# An entry for an ecosystem outside that list -- docker, terraform, nuget and
# the rest Dependabot supports -- stays yours to keep here. The derivation
# rebuilds only what it maps, so a flow reads this file before replacing it and
# reports such an entry by name on its gate rather than dropping it silently.
#
# This file governs version updates, the scheduled bumps for dependencies with
# nothing wrong with them. Security updates are a separate feature that reads
# the dependency graph, needs no entry here, and is switched on in repository
# settings rather than in this file. That distinction decides who fixes a CVE:
# scripts/security fails the pull request that introduces one, and the security
# update opens the pull request that resolves it. With the setting off, the
# first half happens and the second does not.
version: 2
updates:
  # Keeps the action pins in .github/workflows/ current, so a third-party
  # action's immutable commit is reviewed in a pull request rather than moving
  # beneath an unchanged workflow file.
  #
  # "/" covers .github/workflows/ and a root action.yml only. Composite actions
  # under .github/actions/ are not reached from it, so their pins would age
  # silently while the workflow copies stay current. The glob below covers them,
  # and needs `directories`, which supports globbing where `directory` does not.
  #
  # The cooldown is the reason a bump here is not just noise deferred. Dependabot
  # waits three days by default; a week is long enough that an opportunistic
  # package compromise is usually taken down before an update pull request
  # proposes it, and short enough that a real fix is not held back.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"

  # Reads the rev of every hook in .pre-commit-config.yaml. Those pins are
  # exact tags rather than major ones, because pre-commit resolves a rev to a
  # single revision and offers no floating form, so nothing here updates
  # without a bump. The scanners are the reason it matters: a stale gitleaks
  # reports a clean tree by knowing about fewer secret formats.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      pre-commit:
        patterns:
          - "*"

  # Root-only, and derived rather than hand-added: the root pyproject.toml is
  # the manifest that earns it, and the payload ships no pyproject.toml, so the
  # payload's copy of this file must not carry it -- an ecosystem naming a
  # manifest that is not there fails the run, which is the rule at the top of
  # this file. .github/** is managed in .repo-template.json, so a template
  # update replaces this file; the entry comes back because the update derives
  # it again from the same manifest rather than by being carried, which is what
  # makes it unlike a payload file the root drops: that absence survives an
  # update because `generation.features` records it, not because anything
  # rebuilds it.
  #
  # The dependencies are the dev group in the root pyproject.toml: ruff, ty,
  # and pytest. Nothing here ships, so this is not about a CVE reaching a user
  # -- it is that ruff and ty are the gate, and a checker held a year back
  # passes code its current release would refuse.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      pip:
        patterns:
          - "*"
