name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v1.2.3"
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Not cancel-in-progress, unlike the other workflows: a cancelled release can
# stop after publishing some artifacts and none of the rest. Overlapping runs
# queue instead.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so changelog generation can reach the previous tag.
          fetch-depth: 0

      # tools/ci/release runs tools/ci/ci before publishing, and that fails when
      # a manifest is present but its toolchain is missing.
      - name: Set up toolchains
        uses: ./.github/actions/setup-toolchains

      # On a tag push GITHUB_REF_NAME is the tag. A workflow_dispatch run is
      # dispatched against a branch, so the tag comes from the input instead.
      # The value crosses into the step as an environment variable rather than
      # through ${{ }} interpolation, which would paste a dispatch input
      # straight into the shell command.
      - name: Build release artifacts
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: tools/ci/release "$RELEASE_TAG"
