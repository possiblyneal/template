name: Set up toolchains
description: Installs a toolchain for each language manifest present in the repository.

runs:
  using: composite
  steps:
    # scripts/ci fails when a manifest is present but its toolchain is
    # missing, so each toolchain installs only when this repository uses it.
    #
    # Detection comes from scripts/detect rather than being written out
    # again here. This file used to carry its own copy, which is how a language ends
    # up installed for the local scripts and missing in CI.
    - name: Detect toolchains
      id: detect
      shell: bash
      run: scripts/detect github-output >> "$GITHUB_OUTPUT"

    # A crate or native extension linking against a system library resolves its
    # headers through pkg-config, and the runner image ships neither the headers
    # nor the .pc file. Such a build passes on a developer machine that happens
    # to have the package and fails here. A repository that needs one lists it
    # in .github/system-packages.txt, one apt package per line, # for a comment;
    # a repository with no such file runs no apt at all. Not tied to a language,
    # because the need is not: a Rust -sys crate, a Python wheel built from
    # source, and node-gyp all hit it.
    - name: Install system packages
      shell: bash
      run: |
        manifest=.github/system-packages.txt
        [[ -f $manifest ]] || exit 0
        mapfile -t packages < <(sed 's/#.*//' "$manifest" | tr -s '[:space:]' '\n' | grep .)
        [[ ${#packages[@]} -gt 0 ]] || exit 0
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends "${packages[@]}"

    - name: Set up Node
      if: steps.detect.outputs.node == 'true'
      uses: actions/setup-node@v7
      with:
        node-version: lts/*

    - name: Install Node dependencies
      if: steps.detect.outputs.node == 'true'
      shell: bash
      run: |
        if [[ -s package-lock.json ]]; then
          npm ci --no-audit --no-fund
        else
          npm install --no-audit --no-fund
        fi

    - name: Set up Python
      if: steps.detect.outputs.python == 'true'
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        enable-cache: true

    - name: Set up Go
      if: steps.detect.outputs.go == 'true'
      uses: actions/setup-go@v7
      with:
        go-version: stable

    - name: Set up Rust
      if: steps.detect.outputs.rust == 'true'
      shell: bash
      run: rustup component add clippy rustfmt

    # GitHub's Ubuntu runners include Swift, but this controls the requested
    # version rather than inheriting whatever the runner image happens to ship.
    - name: Set up Swift
      if: steps.detect.outputs.swift == 'true'
      uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3
      with:
        swift-version: latest

    - name: Set up Java
      if: steps.detect.outputs.kotlin == 'true'
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: "21"

    - name: Set up Gradle
      if: steps.detect.outputs.kotlin == 'true'
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
