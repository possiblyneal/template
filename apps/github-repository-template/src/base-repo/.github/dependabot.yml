version: 2
updates:
  # Keeps the action pins in .github/workflows/ current, so pinning costs a
  # pull request to review rather than version tracking by hand.
  #
  # "/" covers .github/workflows/ and a root action.yml only. Composite actions
  # under .github/actions/ are not reached from it, so their pins would age
  # silently while the workflow copies stay current. The glob below covers them,
  # and needs `directories`, which supports globbing where `directory` does not.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  # Reads the rev of every hook in .pre-commit-config.yaml. Those pins are
  # exact tags rather than major ones, because pre-commit resolves a rev to a
  # single revision and offers no floating form, so nothing here updates
  # without a bump. The scanners are the reason it matters: a stale gitleaks
  # reports a clean tree by knowing about fewer secret formats.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    groups:
      pre-commit:
        patterns:
          - "*"
