name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A new push to the same branch makes the previous run's result obsolete, and
# leaving it running lets a stale result report after the newer one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Before the toolchains, since it installs none and asserts only that every
      # language present reaches every check. A language dropped from dispatch
      # makes the run below shorter and still green, so nothing after this step
      # would report it.
      - name: Verify check dispatch
        run: scripts/tests/detect-test

      - name: Set up toolchains
        uses: ./.github/actions/setup-toolchains

      - name: Run CI checks
        run: scripts/ci
