name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v1.2.3"
        required: true
  push:
    tags:
      - "v*"

# This workflow validates a release but does not publish yet, so checkout and
# the build need only a read token. When publishing is added, put a
# contents: write permission on its separate job rather than widening this one.
permissions:
  contents: read

# Not cancel-in-progress, unlike the other workflows: a future publisher can
# stop after publishing some artifacts and none of the rest. Overlapping runs
# queue instead.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so changelog generation can reach the previous tag.
          fetch-depth: 0

      # scripts/release runs scripts/ci before packaging and publishing are
      # added, and that fails when a manifest is present but its toolchain is
      # missing.
      - name: Set up toolchains
        uses: ./.github/actions/setup-toolchains

      # On a tag push GITHUB_REF_NAME is the tag. A workflow_dispatch run is
      # dispatched against a branch, so the tag comes from the input instead.
      # The value crosses into the step as an environment variable rather than
      # through ${{ }} interpolation, which would paste a dispatch input
      # straight into the shell command.
      - name: Build release artifacts
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: scripts/release "$RELEASE_TAG"
