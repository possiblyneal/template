name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: gitleaks scans commits, and a shallow clone hides any
          # secret that was committed earlier and later removed from the tip.
          fetch-depth: 0

      - name: Detect toolchains
        id: detect
        run: |
          {
            echo "node=$([[ -s package.json ]] && echo true || echo false)"
            echo "python=$([[ -s pyproject.toml ]] && echo true || echo false)"
            echo "go=$([[ -s go.mod || -s go.work ]] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node
        if: steps.detect.outputs.node == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Set up Python
        if: steps.detect.outputs.python == 'true'
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true

      - name: Set up Go
        if: steps.detect.outputs.go == 'true'
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Install govulncheck
        if: steps.detect.outputs.go == 'true'
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      # tools/ci/security fails outright when no secret scanner is present, so
      # this step is required for every repository regardless of language.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run local security checks
        run: tools/ci/security
