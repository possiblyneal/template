name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: gitleaks scans commits, and a shallow clone hides any
          # secret that was committed earlier and later removed from the tip.
          fetch-depth: 0

      - name: Detect toolchains
        id: detect
        run: |
          {
            echo "node=$([[ -s package.json ]] && echo true || echo false)"
            echo "python=$([[ -s pyproject.toml ]] && echo true || echo false)"
            echo "go=$([[ -s go.mod || -s go.work ]] && echo true || echo false)"
            echo "rust=$([[ -s Cargo.toml ]] && echo true || echo false)"

            # Swift and Gradle audit through trivy, which reads their lockfiles.
            # Package.resolved is committed, and Gradle writes gradle.lockfile
            # only once dependency locking is enabled, so both are read from the
            # checkout rather than produced here.
            trivy=false
            if [[ -s Package.resolved ]] || [[ -n "$(find . -name gradle.lockfile -print -quit)" ]]; then
              trivy=true
            fi
            echo "trivy=$trivy"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node
        if: steps.detect.outputs.node == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Set up Python
        if: steps.detect.outputs.python == 'true'
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Go
        if: steps.detect.outputs.go == 'true'
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Install govulncheck
        if: steps.detect.outputs.go == 'true'
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Install cargo-audit
        if: steps.detect.outputs.rust == 'true'
        run: cargo install cargo-audit --locked

      - name: Install trivy
        if: steps.detect.outputs.trivy == 'true'
        uses: aquasecurity/setup-trivy@v0.3.1

      # No gitleaks install. Secret prevention belongs to GitHub push protection,
      # which blocks a secret before it reaches the remote; a CI scan only finds
      # one that is already pushed. Installing a scanner here meant curling an
      # unverified binary into the job that exists to check supply-chain safety.
      # Enable push protection in repository settings, and run gitleaks locally
      # from .pre-commit-config.yaml.
      - name: Run local security checks
        run: tools/ci/security
