name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # CodeQL ships new queries continuously, so a weekly run finds problems in
    # code that has not changed since the last push.
    - cron: "41 7 * * 2"

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # CodeQL fails when told to analyze a language the repository does not
  # contain, so the language list comes from the manifests actually present
  # rather than from a fixed list this template cannot know.
  detect:
    name: Detect languages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect languages
        id: detect
        run: |
          entries=()
          add() { entries+=("{\"language\":\"$1\",\"build-mode\":\"$2\",\"runner\":\"$3\"}"); }

          if [[ -s package.json ]]; then add javascript-typescript none ubuntu-latest; fi
          if [[ -s pyproject.toml ]]; then add python none ubuntu-latest; fi
          if [[ -s go.mod || -s go.work ]]; then add go autobuild ubuntu-latest; fi
          if [[ -s Cargo.toml ]]; then add rust none ubuntu-latest; fi
          if [[ -s settings.gradle.kts || -s build.gradle.kts ]]; then add java-kotlin autobuild ubuntu-latest; fi
          # CodeQL analyzes Swift on macOS runners only.
          if [[ -s Package.swift ]]; then add swift autobuild macos-latest; fi

          # The workflows are themselves attackable, and they exist before any
          # application code does, so this entry keeps the matrix non-empty and
          # makes the scan useful on a repository that is still a skeleton.
          add actions none ubuntu-latest

          printf 'matrix={"include":[%s]}\n' "$(IFS=,; echo "${entries[*]}")" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze ${{ matrix.language }}
    needs: detect
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
